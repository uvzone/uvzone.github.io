<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aptitude Mock Tests</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: exam hall — question palette on the left, one question at a time on an answer sheet, OMR bubbles */
:root{
  --paper:#f3f5f9; --sheet:#ffffff; --ink:#18202e; --muted:#5b6577; --rule:#d9dfe8;
  --mark:#2448b8; --mark-soft:#e3e9fb; --good:#1c7a4a; --good-soft:#e1f3e9; --bad:#b3362d; --bad-soft:#fbe6e4; --flag:#9a6400; --flag-soft:#fbf0d9;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151c; --sheet:#181e28; --ink:#e7ebf2; --muted:#98a2b4; --rule:#2c3442;
  --mark:#8ea8ff; --mark-soft:#1f2a48; --good:#5fd197; --good-soft:#163527; --bad:#ff8a80; --bad-soft:#3d1c1a; --flag:#f0b54a; --flag-soft:#3a2c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151c; --sheet:#181e28; --ink:#e7ebf2; --muted:#98a2b4; --rule:#2c3442;
  --mark:#8ea8ff; --mark-soft:#1f2a48; --good:#5fd197; --good-soft:#163527; --bad:#ff8a80; --bad-soft:#3d1c1a; --flag:#f0b54a; --flag-soft:#3a2c12; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1{font:800 clamp(28px,5vw,40px)/1.1 var(--display);margin:0;text-wrap:balance}
h2{font:800 20px/1.2 var(--display);margin:0}
.meta,.lbl{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta{color:var(--mark)}
p{margin:0}
.note{color:var(--muted);font-size:15px;max-width:68ch}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.btn{font:700 15px var(--body);background:var(--mark);color:var(--sheet);border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--mark);border:1px solid var(--mark)}
.btn.quiet{background:none;color:var(--muted);border:1px solid var(--rule)}
.btn:disabled{opacity:.45;cursor:default}
input,select{font:15px var(--body);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
input[type=checkbox]{padding:0;width:18px;height:18px;accent-color:var(--mark)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px;display:grid;gap:10px;align-content:start}
.card .lvl{font:800 22px var(--display)}
.card .lvl.hard{color:var(--bad)}
.blueprint{font:14px/1.5 var(--body);color:var(--muted)}
.done{font:600 12px var(--mono);color:var(--good)}
/* exam */
.exam{display:grid;gap:16px;grid-template-columns:200px minmax(0,1fr);align-items:start}
@media (max-width:720px){.exam{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px;display:grid;gap:12px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:720px){.side{position:static}}
.clock{font:600 26px var(--mono);font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pal button{font:600 13px var(--mono);aspect-ratio:1;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;cursor:pointer;padding:0}
.pal button.ans{background:var(--mark);color:var(--sheet);border-color:var(--mark)}
.pal button.flag{box-shadow:inset 0 -4px 0 var(--flag)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal .sec{grid-column:1/-1;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.legend{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px;display:grid;gap:16px;min-width:0}
.qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.qhead .num{font:800 20px var(--display)}
.tag{font:600 12px var(--mono);color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:1px 9px}
.qtext{font-size:17px;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:16px var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:11px 12px;cursor:pointer;width:100%}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted)}
.opt.picked{border-color:var(--mark)}
.opt.picked .bub{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.expl{background:var(--paper);border-left:3px solid var(--mark);padding:10px 12px;font-size:15px}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
/* result */
.score{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px;display:grid;gap:2px}
.stat b{font:800 28px var(--display);font-variant-numeric:tabular-nums}
.stat.main{background:var(--mark-soft);border-color:var(--mark)}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{font:600 11px var(--mono);padding:2px 8px;border-radius:999px}
.pill.r{background:var(--good-soft);color:var(--good)}.pill.w{background:var(--bad-soft);color:var(--bad)}.pill.s{background:var(--paper);color:var(--muted);border:1px solid var(--rule)}
.ask{background:var(--sheet);border:1px solid var(--mark);border-radius:8px;padding:14px 18px;display:grid;gap:6px}
.ask ol{margin:0;padding-left:20px}
.msg{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
// Questions live in yash-data/questions.xlsx. Results go to a Google Sheet when RESULTS_URL is set (see yash-data/RESULTS-SETUP.md).
const QUESTIONS_FILE = "yash-data/questions.xlsx";
const RESULTS_URL = "https://script.google.com/macros/s/AKfycbzaPgJPXjEDjvLk9BiPbGOSK_pa4UiCf6BtvF_JHTjKRXN_dlPFwZTyeaAmnAtI50P6sQ/exec";
let EXAMS = [];
const L = "ABCDE";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
const ls = {get(k,d){try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let attempts = [];
let st = null; // running exam state

function sections(ex){ const m={}; ex.questions.forEach(q=>(m[q.section]=m[q.section]||[]).push(q)); return m; }

/* ---------- questions file ---------- */
async function loadQuestions(){
  const res = await fetch(QUESTIONS_FILE, {cache:"no-cache"});
  if(!res.ok) throw new Error(`Could not load ${QUESTIONS_FILE} (${res.status}).`);
  const wb = XLSX.read(await res.arrayBuffer());
  if(!wb.Sheets.Tests || !wb.Sheets.Questions) throw new Error("questions.xlsx needs a Tests sheet and a Questions sheet.");
  const cell = v => String(v ?? "").trim();
  const rows = XLSX.utils.sheet_to_json(wb.Sheets.Questions, {defval:""});
  const exams = XLSX.utils.sheet_to_json(wb.Sheets.Tests, {defval:""}).filter(t=>cell(t.Test)).map(t=>({
    code:cell(t.Test), day:cell(t.Day), level:cell(t.Level), minutes:+t.Minutes||30, questions:[] }));
  rows.forEach((r,k)=>{
    const where = `Questions sheet row ${k+2}`;
    if(!cell(r.Test) && !cell(r.Question)) return;
    const ex = exams.find(e=>e.code===cell(r.Test));
    if(!ex) throw new Error(`${where}: test "${cell(r.Test)}" is not on the Tests sheet.`);
    const section = cell(r.Section);
    if(!["Verbal","Quant","Logical"].includes(section)) throw new Error(`${where}: section must be Verbal, Quant or Logical.`);
    const options = [...L].map(x=>cell(r[x])).filter(Boolean);
    const answer = L.indexOf(cell(r.Answer).toUpperCase());
    if(answer<0 || answer>=options.length) throw new Error(`${where}: answer "${cell(r.Answer)}" does not match an option.`);
    const n = ex.questions.length+1;
    ex.questions.push({n, id:`${ex.code}-${String(n).padStart(2,"0")}`, section, topic:cell(r.Topic), text:cell(r.Question), options, answer, expl:cell(r.Explanation)});
  });
  return exams.filter(e=>e.questions.length);
}

/* ---------- results sheet ---------- */
async function sendResult(rec){
  const res = await fetch(RESULTS_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(rec)});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||"rejected");
}
async function loadResults(){
  // resend anything that failed to send earlier, then read the full sheet
  const left = [];
  for(const r of ls.get("mock_unsent",[])){ try{ await sendResult(r); }catch(e){ left.push(r); } }
  ls.set("mock_unsent", left);
  const rows = await (await fetch(RESULTS_URL)).json();
  return [...left, ...rows].sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt)));
}

/* ---------- home ---------- */
function home(){
  stopClock();
  const name = ls.get("mock_name","");
  const best = {}; attempts.forEach(a=>{ if(!best[a.exam] || a.score>best[a.exam].score) best[a.exam]=a; });
  $("#app").innerHTML = `
  <header style="display:grid;gap:6px">
    <div class="meta">Campus placement pattern · 30 questions · 50 minutes · pilot</div>
    <h1>Aptitude Mock Tests</h1>
    <p class="note">One question from each of the 30 top placement topics: 10 quantitative aptitude, 10 logical reasoning and 10 verbal ability. Answers stay hidden until you submit. Every attempt is saved, and every wrong or skipped question goes into your error log.</p>
  </header>
  <div class="row"><label class="lbl" for="nm">Your name</label><input id="nm" value="${esc(name)}" placeholder="Prabhas" autocomplete="name"></div>
  <div class="cards">${EXAMS.map(ex=>{const b=best[ex.code];const s=sections(ex);return `
    <div class="card">
      <div class="lbl">${ex.day}</div>
      <div class="lvl ${ex.level==="Hard"?"hard":""}">${ex.level}</div>
      <div class="blueprint">${Object.entries(s).map(([k,v])=>`${k} ${v.length}`).join(" · ")}<br>${ex.minutes} minutes</div>
      ${b?`<div class="done">Best: ${b.score}/${b.total} in ${fmt(b.secs)}</div>`:""}
      <button class="btn" data-start="${ex.code}">Start ${ex.day} ${ex.level}</button>
    </div>`}).join("")}</div>
  <section class="card">
    <div class="row" style="justify-content:space-between"><h2>Error log</h2>
      <button class="btn ghost" id="elog">Open error log</button></div>
    <p class="msg">${errSummary(name)}</p>
  </section>
  <section style="display:grid;gap:10px">
    <div class="row" style="justify-content:space-between"><h2>Attempts</h2>
      <button class="btn ghost" id="xl" ${attempts.length?"":"disabled"}>Download results (.xlsx)</button></div>
    <div class="msg" id="store"></div>
    <div class="tablewrap"><table><thead><tr><th>When</th><th>Name</th><th>Test</th><th>Score</th><th>Verbal</th><th>Quant</th><th>Logical</th><th>Time</th></tr></thead>
    <tbody>${attempts.length?attempts.map(a=>`<tr><td class="n">${esc(new Date(a.submittedAt).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}))}</td><td>${esc(a.name||"—")}</td><td>${esc(a.day)} ${esc(a.level)}</td><td class="n"><b>${a.score}/${a.total}</b></td><td class="n">${a.verbal}</td><td class="n">${a.quant}</td><td class="n">${a.logical}</td><td class="n">${fmt(a.secs)}</td></tr>`).join(""):`<tr><td colspan="8" class="msg">No attempts yet. Your first submitted test appears here.</td></tr>`}</tbody></table></div>
  </section>
  <section class="ask">
    <h2>Prabhas, after Day 1 please tell us</h2>
    <ol><li>Is this close to the real placement test in style and difficulty?</li><li>Is Regular too easy or Hard too hard? Which sections?</li><li>Should the next tests be the full 60 questions in 60 minutes?</li></ol>
  </section>`;
  $("#store").textContent = RESULTS_URL ? "Results are saved to the shared Google Sheet." : "Results are saved in this browser only.";
  $("#nm").oninput = e => ls.set("mock_name", e.target.value.trim());
  $("#nm").onchange = () => home();
  $("#elog").onclick = errorLog;
  document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>start(b.dataset.start));
  const x = $("#xl"); if(x) x.onclick = downloadXlsx;
}

/* ---------- exam ---------- */
let tick = null;
function stopClock(){ clearInterval(tick); tick = null; }
function start(code){
  const ex = EXAMS.find(e=>e.code===code);
  st = {ex, i:0, ans:{}, flag:{}, left:ex.minutes*60, startedAt:new Date().toISOString(), name:ls.get("mock_name","")};
  stopClock();
  tick = setInterval(()=>{ st.left--; const c=$("#clock"); if(c){c.textContent=fmt(Math.max(st.left,0)); c.classList.toggle("low",st.left<=300);} if(st.left<=0) submit(true); },1000);
  examView();
}
function examView(){
  const {ex,i} = st, q = ex.questions[i];
  const answered = Object.keys(st.ans).length;
  let pal = "", last = "";
  ex.questions.forEach((x,k)=>{ if(x.section!==last){ last=x.section; pal+=`<div class="sec">${x.section}</div>`; }
    pal += `<button class="${st.ans[x.id]!=null?"ans":""} ${st.flag[x.id]?"flag":""} ${k===i?"cur":""}" data-go="${k}" aria-label="Question ${x.n}">${x.n}</button>`; });
  $("#app").innerHTML = `
  <div class="row" style="justify-content:space-between"><div class="meta">${ex.day} · ${ex.level}</div><button class="btn quiet" id="quit">Leave test</button></div>
  <div class="exam">
    <aside class="side">
      <div><div class="lbl">Time left</div><div class="clock ${st.left<=300?"low":""}" id="clock">${fmt(st.left)}</div></div>
      <div class="lbl">${answered}/${ex.questions.length} answered</div>
      <div class="pal">${pal}</div>
      <div class="legend"><span>Filled: answered</span><span>Amber line: marked for review</span></div>
      <button class="btn" id="sub">Submit test</button>
    </aside>
    <article class="sheet">
      <div class="qhead"><span class="num">${q.n}.</span><span class="tag">${esc(q.section)}</span><span class="tag">${esc(q.topic)}</span></div>
      <p class="qtext">${esc(q.text)}</p>
      <div class="opts">${q.options.map((o,k)=>`<button class="opt ${st.ans[q.id]===k?"picked":""}" data-pick="${k}"><span class="bub">${L[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div class="nav">
        <div class="row"><button class="btn quiet" id="clr">Clear</button><button class="btn quiet" id="flg">${st.flag[q.id]?"Unmark review":"Mark for review"}</button></div>
        <div class="row"><button class="btn ghost" id="prev" ${i===0?"disabled":""}>Previous</button><button class="btn" id="next">${i===ex.questions.length-1?"Review and submit":"Save and next"}</button></div>
      </div>
      <div class="msg" id="confirm" aria-live="polite"></div>
    </article>
  </div>`;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{st.i=+b.dataset.go;examView()});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{st.ans[q.id]=+b.dataset.pick;examView()});
  $("#clr").onclick=()=>{delete st.ans[q.id];examView()};
  $("#flg").onclick=()=>{st.flag[q.id]=!st.flag[q.id];examView()};
  $("#prev").onclick=()=>{st.i--;examView()};
  $("#next").onclick=()=>{ if(st.i<ex.questions.length-1){st.i++;examView()} else confirmSubmit(); };
  $("#sub").onclick=confirmSubmit;
  $("#quit").onclick=()=>{ const c=$("#confirm"); c.innerHTML=`Leave without saving? <button class="btn quiet" id="qy">Leave</button> <button class="btn ghost" id="qn">Stay</button>`;
    $("#qy").onclick=()=>{st=null;home()}; $("#qn").onclick=()=>c.textContent=""; };
}
function confirmSubmit(){
  const un = st.ex.questions.length - Object.keys(st.ans).length;
  const c=$("#confirm");
  c.innerHTML = `${un?`${un} unanswered. `:""}Submit now? <button class="btn" id="sy">Submit</button> <button class="btn ghost" id="sn">Keep going</button>`;
  $("#sy").onclick=()=>submit(false); $("#sn").onclick=()=>c.textContent="";
}
async function submit(timeUp){
  if(!st || st.submitted) return; st.submitted = true; stopClock();
  const {ex} = st, secs = ex.minutes*60 - Math.max(st.left,0);
  const per = {Verbal:0,Quant:0,Logical:0}, answers = {};
  let score = 0;
  ex.questions.forEach(q=>{ const a=st.ans[q.id]; answers[q.id]= a==null?"":L[a]; if(a===q.answer){score++;per[q.section]++;} });
  const rec = {exam:ex.code, day:ex.day, level:ex.level, name:st.name||"", score, total:ex.questions.length,
    verbal:per.Verbal, quant:per.Quant, logical:per.Logical, secs, timeUp, startedAt:st.startedAt, submittedAt:new Date().toISOString(), answers};
  let saved = "browser";
  if(RESULTS_URL){
    try{ await sendResult(rec); saved="shared"; }
    catch(e){ saved="failed"; const q=ls.get("mock_unsent",[]); q.push(rec); ls.set("mock_unsent",q); }
  } else { const loc=ls.get("mock_attempts",[]); loc.push(rec); ls.set("mock_attempts",loc); }
  attempts = [rec, ...attempts];
  result(rec, saved, timeUp);
}

/* ---------- result + review ---------- */
function result(rec, saved, timeUp){
  const ex = EXAMS.find(e=>e.code===rec.exam), s = sections(ex);
  const topic = {}; ex.questions.forEach(q=>{ const t=topic[q.topic]||(topic[q.topic]={r:0,n:0}); t.n++; if(L[q.answer]===rec.answers[q.id]) t.r++; });
  $("#app").innerHTML = `
  <div class="row" style="justify-content:space-between"><div class="meta">${ex.day} · ${ex.level} · submitted${timeUp?" (time up)":""}</div>
    <div class="row"><button class="btn ghost" id="elog">Error log</button><button class="btn ghost" id="back">All tests</button></div></div>
  <div class="score">
    <div class="stat main"><span class="lbl">Score</span><b>${rec.score}/${rec.total}</b></div>
    ${Object.keys(s).map(k=>`<div class="stat"><span class="lbl">${k}</span><b>${rec[k.toLowerCase()]}/${s[k].length}</b></div>`).join("")}
    <div class="stat"><span class="lbl">Time used</span><b>${fmt(rec.secs)}</b></div>
  </div>
  <p class="msg">${saved==="shared"?"Saved to the shared Google Sheet.":saved==="failed"?"Could not reach the Google Sheet. It is kept in this browser and will be sent next time this page opens.":"Saved in this browser."}</p>
  <div class="tablewrap"><table><thead><tr><th>Topic</th><th>Correct</th></tr></thead><tbody>
    ${Object.entries(topic).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.r}/${v.n}</td></tr>`).join("")}</tbody></table></div>
  <h2>Answer review</h2>
  <div style="display:grid;gap:12px">${ex.questions.map(q=>{ const g=rec.answers[q.id], gi=g?L.indexOf(g):-1, ok=gi===q.answer; return `
    <article class="sheet">
      <div class="qhead"><span class="num">${q.n}.</span><span class="tag">${esc(q.topic)}</span><span class="pill ${gi<0?"s":ok?"r":"w"}">${gi<0?"Skipped":ok?"Correct":"Wrong"}</span></div>
      <p class="qtext">${esc(q.text)}</p>
      <div class="opts">${q.options.map((o,k)=>`<button class="opt ${k===q.answer?"right":k===gi?"wrong":""}" disabled><span class="bub">${L[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <p class="expl">${esc(q.expl)}</p>
    </article>`}).join("")}</div>`;
  $("#back").onclick = ()=>{ st=null; home(); };
  $("#elog").onclick = ()=>{ st=null; errorLog(); };
  window.scrollTo(0,0);
}

/* ---------- error log ---------- */
// Built from saved attempts: one entry per question the person got wrong or skipped, newest first.
// "Why" notes and "learned" marks stay in this browser; a question missed again after being marked learned comes back.
const WHY = ["Didn't know the concept", "Calculation slip", "Misread the question", "Guessed", "Ran out of time"];
let errView = {sec:"All", hide:true};
function mistakes(name){
  const nm = String(name||"").trim().toLowerCase(), m = {};
  attempts.forEach(a=>{
    if(nm && String(a.name||"").trim().toLowerCase()!==nm) return;
    const ex = EXAMS.find(e=>e.code===a.exam); if(!ex) return;
    ex.questions.forEach(q=>{
      const g = (a.answers||{})[q.id]||"", gi = g?L.indexOf(g):-1;
      if(gi===q.answer) return;
      const e = m[q.id] || (m[q.id] = {q, ex, times:0, last:"", gi});
      e.times++;
      const at = String(a.submittedAt); if(at > e.last){ e.last = at; e.gi = gi; }
    });
  });
  return Object.values(m).sort((x,y)=>y.last.localeCompare(x.last));
}
const learned = (e, notes) => (notes[e.q.id]?.learnedAt||"") > e.last;
function weakTopics(list){
  const t = {}; list.forEach(e=>{ const x=t[e.q.topic]||(t[e.q.topic]={topic:e.q.topic, sec:e.q.section, n:0, qs:0}); x.n+=e.times; x.qs++; });
  return Object.values(t).sort((a,b)=>b.n-a.n);
}
function errSummary(name){
  const notes = ls.get("mock_errnotes",{}), open = mistakes(name).filter(e=>!learned(e,notes));
  if(!open.length) return `No mistakes to review${name?` for ${esc(name)}`:""} yet. Wrong and skipped questions appear here after each test.`;
  const top = weakTopics(open).slice(0,3).map(t=>`${esc(t.topic)} (${t.n})`).join(", ");
  return `${open.length} question${open.length>1?"s":""} to review${name?` for ${esc(name)}`:""}. Weakest topics: ${top}.`;
}
function errorLog(){
  stopClock();
  const name = ls.get("mock_name",""), notes = ls.get("mock_errnotes",{});
  const all = mistakes(name), open = all.filter(e=>!learned(e,notes));
  const list = all.filter(e=>(errView.sec==="All"||e.q.section===errView.sec) && !(errView.hide && learned(e,notes)));
  const when = s => new Date(s).toLocaleDateString("en-IN",{dateStyle:"medium"});
  $("#app").innerHTML = `
  <div class="row" style="justify-content:space-between"><div class="meta">Error log${name?` · ${esc(name)}`:" · everyone"}</div><button class="btn ghost" id="back">All tests</button></div>
  <header style="display:grid;gap:6px">
    <h1>Error log</h1>
    <p class="note">Every question ${name?"you":"anyone"} got wrong or skipped, with the right answer and why. Note why you missed it, and mark it as learned once it makes sense. If you miss it again, it comes back.${name?"":" Enter your name on the home page to see only your own mistakes."}</p>
  </header>
  <div class="score">
    <div class="stat main"><span class="lbl">To review</span><b>${open.length}</b></div>
    <div class="stat"><span class="lbl">Learned</span><b>${all.length-open.length}</b></div>
    ${["Quant","Logical","Verbal"].map(s=>`<div class="stat"><span class="lbl">${s}</span><b>${open.filter(e=>e.q.section===s).length}</b></div>`).join("")}
  </div>
  ${open.length?`<div class="tablewrap"><table><thead><tr><th>Top topics to revise</th><th>Section</th><th>Times missed</th></tr></thead><tbody>
    ${weakTopics(open).slice(0,6).map(t=>`<tr><td>${esc(t.topic)}</td><td>${esc(t.sec)}</td><td class="n">${t.n}</td></tr>`).join("")}</tbody></table></div>`:""}
  <div class="row">
    ${["All","Quant","Logical","Verbal"].map(s=>`<button class="btn ${errView.sec===s?"":"quiet"}" data-sec="${s}">${s}</button>`).join("")}
    <label class="msg row" style="gap:6px"><input type="checkbox" id="hide" ${errView.hide?"checked":""}> Hide learned</label>
  </div>
  <div style="display:grid;gap:12px">${list.length?list.map(e=>{ const {q,ex,gi}=e, n=notes[q.id]||{}, done=learned(e,notes); return `
    <article class="sheet">
      <div class="qhead"><span class="tag">${esc(q.section)}</span><span class="tag">${esc(q.topic)}</span>
        <span class="pill ${done?"r":gi<0?"s":"w"}">${done?"Learned":gi<0?"Skipped":"Wrong"}</span>
        <span class="tag">${esc(ex.day)} ${esc(ex.level)} · Q${q.n}</span><span class="tag">${e.times>1?`Missed ${e.times} times · `:""}${esc(when(e.last))}</span></div>
      <p class="qtext">${esc(q.text)}</p>
      <div class="opts">${q.options.map((o,k)=>`<button class="opt ${k===q.answer?"right":k===gi?"wrong":""}" disabled><span class="bub">${L[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <p class="expl">${esc(q.expl)}</p>
      <div class="row" style="justify-content:space-between">
        <div class="row"><label class="lbl" for="why-${q.id}">Why I missed it</label>
          <select id="why-${q.id}" data-why="${q.id}"><option value="">Choose…</option>${WHY.map(w=>`<option ${n.why===w?"selected":""}>${esc(w)}</option>`).join("")}</select></div>
        <button class="btn ${done?"ghost":"quiet"}" data-learn="${q.id}">${done?"Learned ✓ (undo)":"Mark as learned"}</button>
      </div>
    </article>`}).join(""):`<p class="msg">${all.length?"Nothing here with these filters.":"No mistakes logged yet. Take a test and any wrong or skipped questions will show up here."}</p>`}</div>`;
  const save = f => { const x = ls.get("mock_errnotes",{}); f(x); ls.set("mock_errnotes",x); };
  $("#back").onclick = home;
  document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{ errView.sec=b.dataset.sec; errorLog(); });
  $("#hide").onchange = e=>{ errView.hide=e.target.checked; errorLog(); };
  document.querySelectorAll("[data-why]").forEach(s=>s.onchange=()=>save(x=>{ (x[s.dataset.why]=x[s.dataset.why]||{}).why=s.value; }));
  document.querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.learn, e=all.find(x=>x.q.id===id), was=learned(e,notes);
    save(x=>{ const v=x[id]=x[id]||{}; if(was) delete v.learnedAt; else v.learnedAt=new Date().toISOString(); });
    errorLog();
  });
}

/* ---------- excel ---------- */
async function downloadXlsx(){
  const msg = $("#store");
  if(typeof XLSX==="undefined"){ msg.textContent="The spreadsheet tool did not load. Reload the page and try again."; return; }
  const rows = attempts.map(a=>({Submitted:new Date(a.submittedAt).toLocaleString("en-IN"), Name:a.name||"", Test:`${a.day} ${a.level}`, Score:a.score, Total:a.total,
    Verbal:a.verbal, Quant:a.quant, Logical:a.logical, "Time (min)":+(a.secs/60).toFixed(1), "Time up":a.timeUp?"yes":"no"}));
  const detail = [];
  attempts.forEach(a=>{ const ex=EXAMS.find(e=>e.code===a.exam); if(!ex) return; ex.questions.forEach(q=>{ const g=a.answers?.[q.id]||"";
    detail.push({Submitted:new Date(a.submittedAt).toLocaleString("en-IN"), Test:`${a.day} ${a.level}`, Q:q.n, Section:q.section, Topic:q.topic,
      "Your answer":g, Correct:L[q.answer], Result:!g?"Skipped":g===L[q.answer]?"Correct":"Wrong"}); }); });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Attempts");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detail), "Question detail");
  const opt = (q,k) => `${L[k]}. ${q.options[k]}`;
  const errs = [];
  attempts.forEach(a=>{ const ex=EXAMS.find(e=>e.code===a.exam); if(!ex) return; ex.questions.forEach(q=>{ const g=a.answers?.[q.id]||"";
    if(g===L[q.answer]) return;
    errs.push({Submitted:new Date(a.submittedAt).toLocaleString("en-IN"), Name:a.name||"", Test:`${a.day} ${a.level}`, Q:q.n, Section:q.section, Topic:q.topic,
      Question:q.text, "Your answer":g?opt(q,L.indexOf(g)):"Skipped", "Correct answer":opt(q,q.answer), Explanation:q.expl}); }); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(errs), "Error log");
  try{ XLSX.writeFile(wb,"aptitude-mock-results.xlsx"); msg.textContent="Saved."; }
  catch(e){ msg.textContent = "Could not save the file here."; }
}

/* ---------- boot ---------- */
(async()=>{
  $("#app").innerHTML = `<p class="msg">Loading questions…</p>`;
  try{
    if(typeof XLSX==="undefined") throw new Error("The spreadsheet tool did not load. Check your connection and reload.");
    EXAMS = await loadQuestions();
  }catch(e){ $("#app").innerHTML = `<h1>Aptitude Mock Tests</h1><p class="note">${esc(e.message)}</p>`; return; }
  attempts = RESULTS_URL ? ls.get("mock_unsent",[]) : ls.get("mock_attempts",[]).slice().reverse();
  home();
  if(!RESULTS_URL) return;
  try{ attempts = await loadResults(); }catch(e){ attempts = ls.get("mock_unsent",[]); }
  if(!st) home();
})();
</script>
