  <style>
    /* Arcade page extras — uses the colours from style.css */
    .hide { display: none !important; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; margin-block: 12px; }
    .games .c {
      font-family: var(--body); font-weight: 700; font-size: 1.05rem; color: var(--ink);
      background: var(--card); border: 3px solid var(--ink); border-radius: 16px;
      padding: 14px 8px; box-shadow: 4px 4px 0 var(--ink); cursor: pointer; user-select: none;
    }
    .games .c:nth-child(4n+1) { background: var(--sun); }
    .games .c:nth-child(4n+2) { background: var(--sky); }
    .games .c:nth-child(4n+3) { background: var(--leaf); }
    .games .c b { display: block; font-size: 2.2rem; margin-bottom: 4px; }
    .games .c:hover, .games .c:focus-visible { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); outline: none; }
    .games .c:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

    #play { max-width: 600px; width: 100%; margin-inline: auto; user-select: none; -webkit-tap-highlight-color: transparent; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar #ttl { font-family: var(--display); font-size: 1rem; min-width: 0; }
    .bar button { font-size: 0.95rem; padding: 6px 14px; background: var(--pop); color: #fff; white-space: nowrap; }
    canvas { width: 100%; display: block; border-radius: 12px; border: 3px solid var(--ink); background: #000; touch-action: none; }

    .pad { display: flex; flex-wrap: wrap; justify-content: space-between; margin-top: 14px; gap: 8px; }
    .pad div { display: flex; gap: 8px; }
    .pad button {
      width: 64px; height: 64px; padding: 0; border-radius: 16px;
      font-family: system-ui, sans-serif; font-size: 1.5rem; color: var(--ink); background: var(--card);
      border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); touch-action: manipulation;
    }
    .pad button:active { background: var(--pop); color: #fff; transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    #flips button { flex: 1 1 40%; width: auto; height: 56px; font-family: var(--body); font-size: 1rem; font-weight: 700; }
    #mats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .hint { font-size: 0.95rem; opacity: 0.85; margin-top: 12px; text-align: center; }
    @media (max-width: 420px) { .pad button { width: 56px; height: 56px; } }
  </style>
</head>

  <script>
const W=480,H=320,cv=document.getElementById('cv'),c=cv.getContext('2d');
const k={left:0,right:0,up:0,down:0,act:0,bf:0,ff:0,wh:0,st:0};let hit=false,cur=null,last=0;
const km={c:'wh',v:'st',z:'bf',x:'ff',ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',' ':'act',a:'left',d:'right',w:'up',s:'down'};
addEventListener('keydown',e=>{const n=km[e.key];if(n&&cur){e.preventDefault();if(!k[n]&&(n=='act'||n=='up'))hit=true;k[n]=1}});
addEventListener('keyup',e=>{const n=km[e.key];if(n)k[n]=0});
document.querySelectorAll('[data-k]').forEach(b=>{const n=b.dataset.k;
b.addEventListener('pointerdown',e=>{e.preventDefault();k[n]=1;if(n=='act'||n=='up')hit=true});
['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>k[n]=0))});
cv.addEventListener('pointerdown',()=>hit=true);
const R=(a,b)=>a+Math.random()*(b-a);
function txt(s,x,y,sz=20,col='#fff',al='center'){c.fillStyle=col;c.font='bold '+sz+'px system-ui';c.textAlign=al;c.fillText(s,x,y)}
function over(g,m){c.fillStyle='#000a';c.fillRect(0,0,W,H);txt(m,W/2,H/2-6,30);txt('Press ● or tap to continue',W/2,H/2+26,16)}
const P=[];function boom(x,y,col='#fff',n=24){for(let i=0;i<n;i++)P.push({x,y,vx:R(-220,220),vy:R(-220,220),l:R(.4,1),c:col})}
function parts(d){c.save();for(const p of P){p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=300*d;p.l-=d;c.globalAlpha=Math.max(0,p.l);c.fillStyle=p.c;c.fillRect(p.x,p.y,4,4)}c.restore();for(let i=P.length-1;i>=0;i--)if(P[i].l<=0)P.splice(i,1)}
let HS={};try{HS=JSON.parse(localStorage.hs||'{}')}catch(e){}
function sv(id,v){if(v>(HS[id]||0)){HS[id]=v;try{localStorage.hs=JSON.stringify(HS)}catch(e){}}}
const G={};
/* ---------- DRIVE MAD ---------- */
function rp(x){if(x<700)return 0;const u=(x-700)%800;return u<100?50*Math.sin(Math.PI*u/100):u<240?-90*(u-100)/140:0}
function th(x){const f=Math.min(1,x/300)*(1+LV*.4);return rp(x)+250+f*(Math.sin(x/170)*35+Math.sin(x/60)*12*Math.min(1,x/1200)+Math.sin(x/330)*Math.min(70,x/50))}
let FIN=3000,LV=0;const L=42;function hz(x){return LV>0&&x>700&&(x-700)%800>260&&(x-700)%(340-LV*35)<24}
G.drive={n:'Drive Mad',i:'🚗',hint:'▶ gas, ◀ brake/reverse, ▼ brake. In air, ◀▶ tilt. Reach the flag! 5 levels, steeper hills, spikes from level 2.',
init(){FIN=3000+LV*800;this.a={x:60,y:200,vx:0,vy:0};this.b={x:60+L,y:200,vx:0,vy:0};this.st=0;this.best=this.best||0},
update(d){
if(this.st){if(hit){if(this.st==1)LV=Math.min(LV+1,4);this.init()}return}
d=Math.min(d,.03);const a=this.a,b=this.b;let gr=0;
for(let s=0;s<4;s++){const e=d/4;gr=0;
for(const w of[a,b]){w.vy+=520*e;w.x+=w.vx*e;w.y+=w.vy*e;w.gr=0;const gy=th(w.x);
if(w.y>gy-8){w.y=gy-8;const sl=(th(w.x+1)-th(w.x-1))/2,m=Math.hypot(sl,1),nx=sl/m,ny=-1/m,tx=1/m,ty=sl/m;
const vn=w.vx*nx+w.vy*ny;if(vn<0){w.vx-=nx*vn*1.05;w.vy-=ny*vn*1.05}
w.gr=1;gr++;const g=(k.right?1:0)-(k.left?1:0);
if(g){w.vx+=tx*g*520*e;w.vy+=ty*g*520*e}
if(k.down)w.vx*=.96;w.vx*=1-.25*e;
const sp=Math.hypot(w.vx,w.vy);if(sp>420){w.vx*=420/sp;w.vy*=420/sp}}}
if(!gr){const t=((k.right?1:0)-(k.left?1:0))*260*e;b.vy+=t;a.vy-=t}
let dx=b.x-a.x,dy=b.y-a.y,ds=Math.hypot(dx,dy)||1,df=(ds-L)/ds*.5;
a.x+=dx*df;a.y+=dy*df;b.x-=dx*df;b.y-=dy*df;
dx/=ds;dy/=ds;const rel=(b.vx-a.vx)*dx+(b.vy-a.vy)*dy;
a.vx+=dx*rel*.5;a.vy+=dy*rel*.5;b.vx-=dx*rel*.5;b.vy-=dy*rel*.5}
const dx=(b.x-a.x)/L,dy=(b.y-a.y)/L,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,rx=mx+dy*18,ry=my-dx*18;
if(ry>th(rx)-3||my>H+200||(a.gr&&hz(a.x))||(b.gr&&hz(b.x))){this.st=2;boom(170,170,'#ff6b3d',40)}
if(mx>FIN){this.st=1}
this.sc=LV*100+Math.max(0,Math.round(mx/45))},
draw(){const a=this.a,b=this.b,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,cam=mx-170,cy=Math.min(0,H*.55-my);
const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#6ec6ff');gr.addColorStop(1,'#dff3ff');c.fillStyle=gr;c.fillRect(0,0,W,H);
c.save();c.translate(-cam,cy*.6);
c.beginPath();c.moveTo(cam,H+400);for(let x=cam;x<=cam+W+8;x+=6)c.lineTo(x,th(x));c.lineTo(cam+W+8,H+400);c.fillStyle='#5a3d2b';c.fill();
c.beginPath();for(let x=cam;x<=cam+W+8;x+=6)c.lineTo(x,th(x));c.strokeStyle='#4caf50';c.lineWidth=6;c.stroke();
if(LV)for(let x=Math.floor(cam/8)*8;x<cam+W+8;x+=8)if(hz(x)){c.beginPath();c.moveTo(x-4,th(x)+2);c.lineTo(x,th(x)-16);c.lineTo(x+4,th(x)+2);c.fillStyle='#ff3b3b';c.fill()}
c.fillStyle='#fff';c.fillRect(FIN,th(FIN)-70,4,70);c.fillStyle='#e8453c';c.fillRect(FIN+4,th(FIN)-70,28,18);
c.translate(mx,my);c.rotate(Math.atan2(b.y-a.y,b.x-a.x));
c.fillStyle='#e8453c';c.fillRect(-28,-20,56,16);c.fillStyle='#b82e27';c.fillRect(-12,-32,26,13);c.fillStyle='#9fd8ff';c.fillRect(-8,-30,18,9);
c.setTransform(1,0,0,1,0,0);c.save();c.translate(-cam,cy*.6);
for(const w of[a,b]){c.beginPath();c.arc(w.x,w.y,9,0,7);c.fillStyle='#222';c.fill();c.beginPath();c.arc(w.x,w.y,4,0,7);c.fillStyle='#bbb';c.fill()}
c.restore();c.restore();
txt('Level '+(LV+1)+'  '+Math.max(0,Math.round(mx/45))+' / '+FIN/45+' m',10,24,16,'#000','left');
if(this.st==1)over(0,LV<4?'🏁 Level '+(LV+1)+' done!':'🏆 You beat every level!');if(this.st==2)over(0,'💥 Crashed!')}};
/* ---------- DRIVE MAD v2: rigid-body car with suspension ---------- */
G.drive={n:'Drive Mad',i:'🚗',hint:'▶ gas, ◀ brake/reverse, ▼ brake. Rear-wheel drive: gas uphill can wheelie. In air: ◀▶ tilt, Z or ⤺ backflip, X or ⤻ front flip. Big ramps launch you! On the ground: C wheelie, V stoppie. 5 levels, spikes from level 2.',
init(){FIN=3000+LV*800;this.x=80;this.y=215;this.a=0;this.vx=0;this.vy=0;this.w=0;this.st=0;this.wa=[0,0];this.cp=[0,0];this.sp=0;this.rot=0;this.fl=0;this.mt=0;this.wt=0},
update(d){
if(this.st){if(hit){if(this.st==1)LV=Math.min(LV+1,4);this.init()}return}
d=Math.min(d,.033);const N=8,e=d/N,g=k.wh?1:(k.right?1:0)-(k.left?1:0),bk=k.down||k.st;
for(let s=0;s<N&&!this.st;s++){
let cs=Math.cos(this.a),sn=Math.sin(this.a),ax=0,ay=600,tq=0,air=1;
[-22,22].forEach((lx,i)=>{
const rx=lx*cs-13*sn,ry=lx*sn+13*cs,wx=this.x+rx,wy=this.y+ry,pen=wy+9-th(wx);
if(pen<=0){this.cp[i]=0;return}
air=0;
const sl=(th(wx+1)-th(wx-1))/2,m=Math.hypot(sl,1),nx=sl/m,ny=-1/m,tx=1/m,ty=sl/m;
const px=this.vx-this.w*ry,py=this.vy+this.w*rx,vn=px*nx+py*ny,vt=px*tx+py*ty;
const Fn=Math.min(1400,Math.max(0,55*pen-7*vn));
let Ft=0;
if(bk||(g&&g*vt<-25))Ft=-Math.sign(vt)*Math.min(Math.abs(vt)*6,320);
else if(g)Ft=g*(i?170:300)*(g*vt>0?Math.max(0,1-Math.abs(vt)/430):1);
Ft=Math.max(-Fn*1.1,Math.min(Fn*1.1,Ft));
const Fx=nx*Fn+tx*Ft,Fy=ny*Fn+ty*Ft;
ax+=Fx;ay+=Fy;tq+=rx*Fy-ry*Fx;
this.wa[i]+=vt*e/9;this.cp[i]=Math.min(8,pen);
if(pen>12){this.y-=(pen-12)*.8;if(this.vy>0)this.vy*=.5}
if(hz(wx))this.st=2;
});
if(air){tq+=g*4500+(k.ff?9000:0)-(k.bf?9000:0);this.w*=1-.15*e}else this.w*=1-.6*e;
if(air)this.rot+=this.w*e;else if(this.rot){const n=Math.round(Math.abs(this.rot)/6.283);if(n){this.fl+=n;this.msg=(this.rot<0?'BACKFLIP':'FRONT FLIP')+(n>1?' x'+n:'')+'!';this.mt=1.6;boom(170,this.y+Math.min(0,H*.55-this.y)*.6-30,'#ffe14c',22)}this.rot=0}
if(!air&&(k.wh||k.st)){tq+=Math.max(-20000,Math.min(20000,30000*((k.wh?-.55:.45)-this.a)))-2500*this.w}
this.vx+=ax*e;this.vy+=ay*e;this.w=Math.max(-9,Math.min(9,this.w+tq/800*e));
this.x+=this.vx*e;this.y+=this.vy*e;this.a+=this.w*e;
cs=Math.cos(this.a);sn=Math.sin(this.a);
for(const[lx,ly]of[[-20,-20],[20,-20]]){const qx=this.x+lx*cs-ly*sn,qy=this.y+lx*sn+ly*cs;if(qy>th(qx)-2)this.st=2}
for(const lx of[-26,0,26]){const qx=this.x+lx*cs-11*sn,qy=this.y+lx*sn+11*cs,p=qy-th(qx);if(p>0){this.y-=p;if(this.vy>0)this.vy=0}}
}
if(this.y>H+250)this.st=2;if(this.x>FIN)this.st=1;
this.sp=Math.hypot(this.vx,this.vy);this.sc=LV*100+Math.max(0,Math.round(this.x/45))+this.fl*10+Math.floor(this.wt*3);if(this.mt>0)this.mt-=d;if(!this.st&&(k.wh||k.st)&&((this.cp[0]>0&&this.cp[1]==0)||(this.cp[1]>0&&this.cp[0]==0)))this.wt+=d;
const cy=Math.min(0,H*.55-this.y)*.6,cam=this.x-170;
if(this.st==2)boom(170,this.y+cy,'#ff6b3d',45);
if(this.st==1)boom(170,this.y+cy-20,'#ffe14c',40);
if(!this.st&&this.cp[0]+this.cp[1]>0&&this.sp>140&&Math.random()<.5)P.push({x:this.x-cam-20,y:this.y+cy+20,vx:R(-60,-15),vy:R(-70,-20),l:.35,c:'#d9c9a8'})},
draw(){const cam=this.x-170,cy=Math.min(0,H*.55-this.y)*.6;
const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5db7f5');gr.addColorStop(1,'#e4f5ff');c.fillStyle=gr;c.fillRect(0,0,W,H);
c.fillStyle='#9ccfe8';c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=8)c.lineTo(x,200+Math.sin((x+cam*.25)/90)*30+Math.sin((x+cam*.25)/37)*8);c.lineTo(W,H);c.fill();
c.save();c.translate(-cam,cy);
c.beginPath();c.moveTo(cam,H+600);for(let x=cam;x<=cam+W+8;x+=6)c.lineTo(x,th(x));c.lineTo(cam+W+8,H+600);c.fillStyle='#5a3d2b';c.fill();
c.beginPath();for(let x=cam;x<=cam+W+8;x+=6)c.lineTo(x,th(x));c.strokeStyle='#4caf50';c.lineWidth=6;c.stroke();
if(LV)for(let x=Math.floor(cam/8)*8;x<cam+W+8;x+=8)if(hz(x)){c.beginPath();c.moveTo(x-4,th(x)+2);c.lineTo(x,th(x)-16);c.lineTo(x+4,th(x)+2);c.fillStyle='#ff3b3b';c.fill()}
c.fillStyle='#fff';c.fillRect(FIN,th(FIN)-70,4,70);c.fillStyle='#e8453c';c.fillRect(FIN+4,th(FIN)-70,28,18);
c.translate(this.x,this.y);c.rotate(this.a);
if(this.st!=2){
c.fillStyle='#e8453c';c.beginPath();c.moveTo(-32,8);c.lineTo(-32,-6);c.lineTo(-14,-8);c.lineTo(-8,-20);c.lineTo(12,-20);c.lineTo(22,-8);c.lineTo(32,-5);c.lineTo(32,8);c.closePath();c.fill();
c.fillStyle='#bfe6ff';c.beginPath();c.moveTo(-5,-17);c.lineTo(10,-17);c.lineTo(17,-9);c.lineTo(-9,-9);c.fill();
c.fillStyle='#ffe14c';c.fillRect(28,-4,4,5);c.fillStyle='#900';c.fillRect(-32,-4,3,5)}
[-22,22].forEach((lx,i)=>{c.save();c.translate(lx,13-this.cp[i]);c.rotate(this.wa[i]);c.beginPath();c.arc(0,0,9,0,7);c.fillStyle='#222';c.fill();c.fillStyle='#ccc';c.fillRect(-7,-1,14,2);c.fillRect(-1,-7,2,14);c.restore()});
c.restore();
txt('Level '+(LV+1)+'   '+Math.max(0,Math.round(this.x/45))+' / '+Math.round(FIN/45)+' m   '+Math.round(this.sp*.2)+' km/h   Flips '+this.fl+'  Balance '+this.wt.toFixed(1)+'s',10,22,15,'#123','left');if(this.mt>0)txt(this.msg,W/2,70,28,'#ff9d00');
if(this.st==1)over(0,LV<4?'🏁 Level '+(LV+1)+' done!':'🏆 You beat every level!');if(this.st==2)over(0,'💥 Crashed!')}};
/* ---------- SNAKE ---------- */
G.snake={n:'Snake',i:'🐍',hint:'Arrows to steer. Eat the apples.',
init(){this.s=[{x:10,y:8},{x:9,y:8},{x:8,y:8}];this.d={x:1,y:0};this.nd=this.d;this.f={x:15,y:8};this.t=0;this.sc=0;this.dead=0},
update(d){if(this.dead){if(hit)this.init();return}
if(k.left&&this.d.x==0)this.nd={x:-1,y:0};if(k.right&&this.d.x==0)this.nd={x:1,y:0};
if(k.up&&this.d.y==0)this.nd={x:0,y:-1};if(k.down&&this.d.y==0)this.nd={x:0,y:1};
this.t+=d;if(this.t<Math.max(.05,.11-this.sc*.003))return;this.t=0;this.d=this.nd;
const h={x:this.s[0].x+this.d.x,y:this.s[0].y+this.d.y};
if(h.x<0||h.y<0||h.x>=24||h.y>=16||this.s.some(p=>p.x==h.x&&p.y==h.y)){this.dead=1;return}
this.s.unshift(h);if(h.x==this.f.x&&h.y==this.f.y){this.sc++;boom(this.f.x*20+10,this.f.y*20+10,'#ff4d4d',14);this.f={x:Math.floor(R(0,24)),y:Math.floor(R(0,16))}}else this.s.pop()},
draw(){c.fillStyle='#10201a';c.fillRect(0,0,W,H);c.fillStyle='#ff4d4d';c.beginPath();c.arc(this.f.x*20+10,this.f.y*20+10,8,0,7);c.fill();
this.s.forEach((p,i)=>{c.fillStyle=i?'#3ddc84':'#b6ffd0';const z=Math.max(10,18-i*.3);c.beginPath();c.roundRect(p.x*20+10-z/2,p.y*20+10-z/2,z,z,i?4:7);c.fill();if(!i){c.fillStyle='#000';c.fillRect(p.x*20+10+this.d.x*4-2+this.d.y*4,p.y*20+10+this.d.y*4-2-this.d.x*4,3,3);c.fillRect(p.x*20+10+this.d.x*4-2-this.d.y*4,p.y*20+10+this.d.y*4-2+this.d.x*4,3,3)}});txt('Score '+this.sc,8,20,16,'#fff','left');if(this.dead)over(0,'Game Over: '+this.sc)}};
/* ---------- FLAPPY ---------- */
G.flappy={n:'Flappy Bird',i:'🐤',hint:'Tap, ▲ or ● to flap.',
init(){this.y=150;this.v=0;this.p=[];this.t=0;this.sc=0;this.dead=0;this.go=0},
update(d){if(this.dead){if(hit)this.init();return}
