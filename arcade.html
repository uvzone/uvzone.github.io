    .hide { display: none !important; }

    .games .c {
      font-family: var(--body); font-weight: 700; font-size: 1.05rem; color: var(--ink);
      background: var(--card); border: 3px solid var(--ink); border-radius: 16px;
      padding: 14px 8px; box-shadow: 4px 4px 0 var(--ink); cursor: pointer; user-select: none;
    }
    .games .c:nth-child(4n+1) { background: var(--sun); }
    .games .c:nth-child(4n+2) { background: var(--sky); }
    .games .c:nth-child(4n+3) { background: var(--leaf); }

    .games .c:hover, .games .c:focus-visible { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); outline: none; }
    .games .c:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

    #play { max-width: 600px; width: 100%; margin-inline: auto; user-select: none; -webkit-tap-highlight-color: transparent; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar #ttl { font-family: var(--display); font-size: 1rem; min-width: 0; }
    .bar button { font-size: 0.95rem; padding: 6px 14px; background: var(--pop); color: #fff; white-space: nowrap; }
    canvas { width: 100%; display: block; border-radius: 12px; box-shadow: 0 0 0 3px var(--ink); background: #000; touch-action: none; }

    .pad { display: flex; flex-wrap: wrap; justify-content: space-between; margin-top: 14px; gap: 8px; }
    .pad div { display: flex; gap: 8px; }
    .pad button {
      width: 64px; height: 64px; padding: 0; border-radius: 16px;
      font-family: system-ui, sans-serif; font-size: 1.5rem; color: var(--ink); background: var(--card);
      border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); touch-action: manipulation;
    }
    .pad button:active { background: var(--pop); color: #fff; transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    #flips button { flex: 1 1 40%; width: auto; height: 56px; font-family: var(--body); font-size: 1rem; font-weight: 700; }
    #mats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    #mats button { flex: 1 1 22%; font-family: var(--body); font-size: 0.9rem; font-weight: 700; padding: 6px 4px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); box-shadow: 2px 2px 0 var(--ink); }
    #mats button.on { background: var(--sun); outline: 3px solid var(--pop); outline-offset: 1px; }
    .hint { font-size: 0.95rem; opacity: 0.85; margin-top: 12px; text-align: center; }
    @media (max-width: 420px) { .pad button { width: 56px; height: 56px; } }
  </style>
</head>
