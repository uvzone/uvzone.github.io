  <style>
    /* Origami page extras — uses the colours from style.css */
    .o-hero { text-align: center; transform: rotate(1deg); }
    .o-hero .num { font-family: var(--display); font-size: 4rem; line-height: 1; color: var(--sun); -webkit-text-stroke: 3px var(--ink); }
    .o-hero .stars { letter-spacing: 6px; font-size: 1.2rem; }

    .filters { display: grid; gap: 14px; }
    .filters h2 { font-size: 1rem; margin-bottom: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-family: var(--body); font-weight: 700; font-size: 1rem;
      color: var(--ink); background: var(--card);
      border: 3px solid var(--ink); border-radius: 999px;
      padding: 4px 14px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
    }
    .chip.on { background: var(--sky); }
    .chip.t.on { background: var(--sun); }

    .models { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
    .model {
      font: inherit; color: var(--ink); text-align: left; cursor: pointer;
      background: var(--card); border: 4px solid var(--ink); border-radius: 20px;
      box-shadow: 6px 6px 0 var(--ink); padding: 0; overflow: hidden;
    }
    .model:hover, .model:focus-visible { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); outline: none; }
    .art { font-size: 3.4rem; text-align: center; padding: 14px 0; background: var(--sky); border-bottom: 4px solid var(--ink); }
    .model:nth-child(3n+2) .art { background: var(--leaf); }
    .model:nth-child(3n+3) .art { background: var(--sun); }
    .mbody { padding: 12px 14px 14px; }
    .mbody h3 { font-family: var(--display); font-weight: 400; font-size: 1.1rem; margin: 0 0 4px; }
    .mbody p { font-size: 1rem; }

    .tag { display: inline-block; font-size: 0.85rem; font-weight: 700; padding: 1px 10px; border: 2px solid var(--ink); border-radius: 999px; margin-right: 4px; }
    .Easy { background: var(--leaf); }
    .Medium { background: var(--sun); }
    .Hard { background: var(--pop); color: #fff; }
    .th { background: var(--card); }

    dialog {
      border: 4px solid var(--ink); border-radius: 20px; padding: 0;
      max-width: 460px; width: calc(100% - 32px); max-height: 88vh; overflow-y: auto;
      background: var(--card); color: var(--ink); box-shadow: 8px 8px 0 var(--ink);
    }
    dialog::backdrop { background: rgba(29, 26, 43, 0.6); }
    .m { padding: 20px; }
    .m .art { border: 3px solid var(--ink); border-radius: 14px; margin-bottom: 12px; }
    .m h3 { font-family: var(--display); font-weight: 400; font-size: 1.4rem; margin: 0 0 6px; }
    .m h4 { font-family: var(--display); font-weight: 400; margin: 14px 0 4px; }
    .m ul, .m ol { padding-left: 22px; margin: 8px 0; }
    .m ol li { margin-bottom: 8px; }
    .x { float: right; padding: 2px 12px; font-size: 1rem; }
    /* Step pictures: always drawn on light paper so the lines show in every theme */
    .sp { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .sp > span { min-width: 0; }
    .r { flex: 0 0 96px; text-align: center; }
    .pic { width: 96px; height: 96px; background: #f4f6f8; border-radius: 12px; border: 2px solid var(--ink); color: #26313b; }
    .r small, .fin small { display: block; font-size: 0.8rem; opacity: 0.8; }
    .fin { text-align: center; margin: 12px 0; }
    .fin svg { width: 190px; height: 190px; max-width: 100%; background: #f4f6f8; border-radius: 16px; border: 2px solid var(--ink); color: #26313b; }
    .m h4 small { font-family: var(--body); font-size: 0.85rem; opacity: 0.8; }
  </style>
</head>

    var df = "All", tf = "All";

    function chips(id, list, cls, get, set) {
      var e = document.getElementById(id);
      e.innerHTML = "";
      list.forEach(function (v) {
        var b = document.createElement("button");
        b.className = "chip " + cls + (get() == v ? " on" : "");
        b.textContent = t(v);
        b.onclick = function () { set(v); draw(); };
        e.appendChild(b);
      });
    }

    function draw() {
      chips("dif", ["All", "Easy", "Medium", "Hard"], "d", function () { return df; }, function (v) { df = v; });
      chips("thm", ["All", "Nature", "Ninja", "Football", "Space", "Fantasy", "Vehicles", "Sea", "Dinosaur", "Superhero", "Sports"], "t", function () { return tf; }, function (v) { tf = v; });
      var L = D.filter(function (x) { return (df == "All" || x.d == df) && (tf == "All" || x.t == tf); });
      document.getElementById("count").textContent = (L.length == 1 ? t("model1") : t("models", L.length));
      var g = document.getElementById("grid");
      g.innerHTML = "";
      L.forEach(function (x) {
        var c = document.createElement("button");
        c.className = "model";
        c.innerHTML = '<div class="art">' + x.i + '</div><div class="mbody"><h3>' + x.n + '</h3><p>' + x.p + '</p><span class="tag ' + x.d + '">' + t(x.d) + '</span><span class="tag th">' + t(x.t) + '</span></div>';
        c.onclick = function () { openModel(x); };
        g.appendChild(c);
      });
    }

    function openModel(x) {
      var d = document.getElementById("dlg");
      var steps = ST[x.n].map(function (step, k) {
        var picture = IMG[x.n][k] ? pic(IMG[x.n][k], k + 1, (CR[x.n] || {})[k], x.n) : "";
        return '<li><div class="sp"><span>' + step + '</span><div class="r">' + picture + '<small>' + t("after_step", k + 1) + '</small></div></div></li>';
      }).join("");
      d.innerHTML = '<div class="m"><button class="x" aria-label="Close">✕</button><div class="art">' + x.i + '</div><h3>' + x.n + '</h3>'

        + start(x.n)
        + '<ol>' + steps + '</ol></div>';

      d.querySelector(".x").onclick = function () { d.close(); };

      d.showModal();
